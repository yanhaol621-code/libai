<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 电商·视频混剪工作台</title>
<link rel="icon" href="/img/ip/maid-head.webp">
<link rel="stylesheet" href="/css/style.css?v=20261028s">
<style>
  body {
    background:
      radial-gradient(900px 640px at 86% -2%, rgba(96, 152, 244, .46) 0%, transparent 62%),
      radial-gradient(720px 560px at 2% 102%, rgba(246, 196, 69, .26) 0%, transparent 62%),
      radial-gradient(620px 520px at 96% 104%, rgba(150, 190, 250, .4) 0%, transparent 62%),
      linear-gradient(166deg, #fdfbf5 0%, #eff6ff 48%, #dceaff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 背景漂浮气泡 / 金色小星 / 光斑：已统一到 /css/style.css 的 .mx-* 与 js/common.js，全站共用 */

  .login-wrap {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    padding: 34px 20px;
    position: relative; z-index: 2;
  }

  /* 左右分栏大卡 */
  .login-shell {
    width: 100%; max-width: 920px;
    min-height: 552px;
    display: grid; grid-template-columns: 1.04fr .96fr;
    background: #fff;
    border-radius: 32px;
    overflow: hidden;
    border: 1px solid #e7eefb;
    box-shadow: 0 34px 80px rgba(40, 90, 175, .18), 0 4px 12px rgba(40, 90, 175, .06);
    animation: cardIn .55s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }

  /* 左侧 IP 展示 */
  .login-visual {
    position: relative;
    padding: 32px 30px 30px;
    display: flex; flex-direction: column; justify-content: center;
    background:
      radial-gradient(420px circle at 78% 0%, rgba(246, 196, 69, .22), transparent 60%),
      radial-gradient(560px circle at 62% 10%, rgba(126, 196, 255, .55), transparent 68%),
      radial-gradient(340px circle at 0% 100%, rgba(186, 210, 255, .5), transparent 62%),
      linear-gradient(165deg, #fdfaf1 0%, #eaf4ff 52%, #d8e9ff 100%);
    border-right: 1px solid #eaf1fc;
    overflow: hidden;
  }
  .login-visual::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(47, 107, 224, .16) 1px, transparent 1px);
    background-size: 17px 17px;
    -webkit-mask-image: radial-gradient(circle at 50% 34%, #000 8%, transparent 70%);
    mask-image: radial-gradient(circle at 50% 34%, #000 8%, transparent 70%);
    opacity: .5;
    pointer-events: none;
  }

  /* IP 相框 */
  .ip-figure { position: relative; z-index: 2; display: grid; place-items: center; margin: 0 auto 16px; }
  .ip-figure .ring {
    position: absolute;
    width: 288px; height: 288px;
    border-radius: 50%;
    border: 2px dashed rgba(122, 176, 244, .45);
    box-shadow: inset 0 0 0 13px rgba(255, 255, 255, .42);
  }
  .ip-figure .frame {
    position: relative;
    width: 214px;
    padding: 6px;
    border-radius: 30px;
    background: #fff;
    border: 1px solid #e3ebfa;
    box-shadow: 0 18px 38px rgba(30, 74, 160, .2), 0 0 0 6px rgba(255, 255, 255, .55);
    transform: rotate(-2.4deg);
    animation: bob 5.6s ease-in-out infinite;
  }
  .ip-figure .frame img { display: block; width: 100%; height: auto; border-radius: 25px; background: var(--cream); }
  @keyframes bob { 0%,100% { transform: rotate(-2.4deg) translateY(0); } 50% { transform: rotate(-1deg) translateY(-8px); } }
  .ip-figure .spark { position: absolute; color: var(--gold); font-size: 24px; line-height: 1; text-shadow: 0 2px 8px rgba(246,196,69,.5); }
  .ip-figure .spark.sp1 { top: 2%; left: 2%; font-size: 18px; }
  .ip-figure .spark.sp2 { top: 12%; right: 0; font-size: 26px; }
  .ip-figure .spark.sp3 { bottom: 4%; left: 8%; font-size: 15px; }

  .login-visual h1 {
    position: relative; z-index: 2;
    text-align: center;
    margin: 6px 0 8px;
    font-size: 21px; font-weight: 800; line-height: 1.45;
    letter-spacing: -.4px; color: #12294a;
  }
  .login-visual p {
    position: relative; z-index: 2;
    margin: 0 auto; max-width: 300px;
    text-align: center;
    font-size: 12.8px; line-height: 1.75; color: #61728c;
  }
  .visual-list {
    position: relative; z-index: 2;
    list-style: none; display: flex; flex-wrap: wrap; gap: 7px;
    justify-content: center; padding: 0; margin: 15px 0 0;
  }
  .visual-list li {
    font-size: 11.5px; color: #2f5c94; font-weight: 500;
    background: rgba(255, 255, 255, .9);
    border: 1px solid #e0ecfc;
    border-radius: var(--radius-pill);
    padding: 5px 12px;
  }

  /* 右侧登录表单 */
  .login-card {
    width: auto; max-width: none;
    background: #fff;
    border: none; border-radius: 0;
    box-shadow: none;
    padding: 46px 44px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .login-brand { text-align: left; margin-bottom: 24px; }
  .login-brand .logo-text { font-size: 20.5px; font-weight: 800; letter-spacing: -.3px; color: #0f2340; }
  .login-brand .sub { color: var(--text-soft); font-size: 13px; margin-top: 7px; }

  .login-field { margin-bottom: 15px; }
  .login-field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; color: #2b3d59; }
  .login-field input {
    width: 100%; padding: 12px 14px; font-size: 14px;
    border: 1.5px solid #e4ecf8; border-radius: 14px;
    font-family: inherit; outline: none; background: #f9fbff;
    transition: all .18s;
  }
  .login-field input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(47,107,224,.12); }

  .login-btn {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(135deg, #4b8bf5, #2158c9);
    color: #fff; border: none; border-radius: 14px; margin-top: 8px;
    box-shadow: 0 10px 24px rgba(47,107,224,.32);
    cursor: pointer; transition: all .2s;
    display: block;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(47,107,224,.4); color:#fff; }
  .login-btn:disabled { opacity: .7; transform: none; }
  .login-err {
    display: none; margin-top: 13px; font-size: 12.5px; color: #b91c1c;
    background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 12px; padding: 9px 12px;
  }
  .login-foot { margin-top: 18px; text-align: left; font-size: 12px; color: var(--text-soft); }
  .login-foot b { color: var(--primary); font-weight: 600; }

  .login-slogan {
    text-align: center; color: #7b8aa0;
    font-size: 12.5px; letter-spacing: .4px; position: relative; z-index: 2;
    opacity: 0; transform: translateY(3px);
    transition: opacity .45s ease, transform .45s ease;
    min-height: 18px;                 /* 换文案时不跳动 */
  }
  .login-slogan.in { opacity: 1; transform: none; }

  @media (max-width: 780px) {
    .login-shell { grid-template-columns: 1fr; max-width: 430px; }
    .login-visual { padding: 22px 22px 16px; border-right: none; border-bottom: 1px solid #eaf2fc; }
    .ip-figure { margin-bottom: 10px; }
    .ip-figure .frame { width: 132px; border-radius: 24px; }
    .ip-figure .frame img { border-radius: 19px; }
    .ip-figure .ring { width: 184px; height: 184px; }
    .login-visual h1 { font-size: 17.5px; margin: 2px 0 0; }
    .login-visual p, .visual-list { display: none; }
    .login-card { padding: 24px 24px 30px; }
    .login-brand { text-align: center; margin-bottom: 18px; }
    .login-brand .logo-text { font-size: 18px; }
    .login-foot { text-align: center; }
  }
</style>
</head>
<body>
<!-- 背景漂浮气泡/小星/光斑由 js/common.js 的 AMBIENT 模块统一注入（全站共用） -->

<div class="login-wrap">
  <div class="login-shell">
    <aside class="login-visual">
      <div class="ip-figure">
        <span class="ring"></span>
        <span class="spark sp1">✦</span>
        <span class="spark sp2">✦</span>
        <span class="spark sp3">✦</span>
        <figure class="frame"><img src="/img/ip/maid.webp" alt="工作台 IP 形象"></figure>
      </div>
      <h1>把素材拖进来<br>剩下的交给小鲸鱼</h1>
      <p>自动分析镜头、挑选片段、加字幕配乐，一次产出多条可直接发布的电商短视频。</p>
      <ul class="visual-list">
        <li>镜头自动分析</li>
        <li>多版本批量出片</li>
        <li>竖屏 / 方形 / 横屏</li>
      </ul>
    </aside>

    <main class="login-card">
      <div class="login-brand">
        <div class="logo-text">电商·视频混剪工作台</div>
        <div class="sub">登录后管理自己的项目与视频</div>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="login-field">
          <label for="account">登录账号</label>
          <input id="account" name="account" type="text" placeholder="手机号或自定义账号" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button class="login-btn" id="login-btn" type="submit">登 录</button>
        <div class="login-err" id="login-err"></div>
      </form>

      <div class="login-foot">子账号由主账号在 <b>团队管理</b> 中创建</div>
    </main>
  </div>
  <div class="login-slogan" id="login-slogan">鲸鱼女仆在线待命 · 今天也要好好出片呀</div>
</div>

<script src="/js/common.js?v=20261028m"></script>
<script>
const next = new URLSearchParams(location.search).get('next') || '/index.html';

// ===== 底部励志文案：每次打开登录页随机换一条（不与上次重复）=====
(function slogan() {
  const LIST = [
    '今天多剪一条 · 明天多卖一单',
    '素材不会自己变爆款 · 但你可以',
    '认真剪的每一刀 · 都会变成订单',
    '慢一点没关系 · 别停下来就好',
    '好内容不怕多 · 怕的是还没开始',
    '把重复的活交出去 · 把心思留给选品',
    '小店慢慢来 · 也会有回头客',
    '剪着剪着 · 就剪出门道了',
    '今天的努力 · 是明天店铺的底气',
    '没有人一开始就会 · 都是练出来的',
    '你只管把好货摆上 · 剩下的交给时间',
    '一天出十条 · 不如条条都用心',
    '别怕晚 · 现在开始就是最早的时候',
    '每次点开这里 · 都是新的机会',
    '坚持出片的人 · 运气都不会太差',
    '你的认真 · 顾客看得见',
    '把今天的素材 · 变成明天的生意',
    '一点点积累 · 就是小店的护城河',
    '与其等爆款 · 不如先做出来',
    '稳住节奏 · 一条一条往前走',
  ];
  const el = document.getElementById('login-slogan');
  if (!el) return;
  const KEY = 'mx_login_slogan';
  let last = -1;
  try { last = parseInt(localStorage.getItem(KEY), 10); } catch (_) {}
  let i = Math.floor(Math.random() * LIST.length);
  // 与上一次不同（长度>1 时用偏移保证不撞）
  if (LIST.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (LIST.length - 1))) % LIST.length;
  try { localStorage.setItem(KEY, String(i)); } catch (_) {}
  el.textContent = LIST[i];
  requestAnimationFrame(() => el.classList.add('in'));
})();

// 已登录直接进入
(async () => {
  try {
    const r = await fetch('/api/auth/me');
    if (r.ok) location.replace(next);
  } catch (_) {}
})();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  err.style.display = 'none';
  if (!account || !password) { err.textContent = '请输入账号和密码'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account, password }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '登录失败');
    location.replace(next);
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
