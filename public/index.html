<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商·视频混剪工作台</title>
<link rel="icon" href="/img/ip/maid-head.webp">
<link rel="stylesheet" href="/css/style.css?v=20261028s">
</head>
<body>
<div class="header">
  <div class="logo"><img src="/img/ip/maid-head.webp" alt="">电商·视频混剪工作台</div>
  <div class="nav">
    <a href="/index.html">首页</a>
    <a href="/today.html">今日数据</a>
  </div>
</div>
<div class="container">
  <section class="hero-v2">
    <div class="hero-copy">
      <div class="hero-eyebrow"><img class="eyebrow-avatar" src="/img/ip/maid-head.webp" alt=""><span>AI 混剪工作台 · 电商专版</span></div>
      <h1 id="hero-title">你好，今天想剪哪款产品？</h1>
      <p>把同一产品的视频与图片拖进来，自动分析镜头、筛选排列、加字幕配乐，批量产出可直接发布的电商短视频。</p>
      <div class="hero-cta">
        <a class="btn btn-primary btn-lg" href="/create.html">＋ 新建混剪项目</a>
        <a class="btn btn-lg" href="/today.html?tab=videos">查看今日产出</a>
      </div>
      <div class="hero-tags">
        <span>自动分析镜头</span><span>多版本批量出片</span><span>9:16 竖屏</span><span>一键打包下载</span>
      </div>
    </div>
    <div class="hero-art">
      <div class="ip-glow"></div>
      <span class="ip-ring"></span>
      <span class="ip-spark s1">✦</span>
      <span class="ip-spark s2">✦</span>
      <span class="ip-spark s3">✦</span>
      <figure class="ip-frame">
        <img src="/img/ip/maid.webp" alt="工作台 IP 形象">
        <figcaption class="ip-caption">今天也要好好出片呀</figcaption>
      </figure>
      <span class="ip-badge b1">秒级分析</span>
      <span class="ip-badge b2">一键出片</span>
    </div>
  </section>

  <div id="perm-tip" class="scope-bar" style="display:none"></div>

  <div class="stats-strip">
    <div class="stat-cell">
      <span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg></span>
      <div class="num" id="stat-projects">0</div><div class="label">项目总数量</div>
    </div>
    <div class="stat-cell">
      <span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M12 13.5v4M10 15.5h4"/></svg></span>
      <div class="num" id="stat-today-projects">0</div><div class="label">今日新建项目数量</div>
    </div>
    <div class="stat-cell">
      <span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.6" cy="10" r="1.6"/><path d="M3.6 17.2l4.6-4.3a1.6 1.6 0 0 1 2.2 0l3.4 3.2 1.8-1.7a1.6 1.6 0 0 1 2.2 0l2.2 2"/></svg></span>
      <div class="num" id="stat-today-materials">0</div><div class="label">今日添加素材总数量</div>
    </div>
    <a class="stat-cell stat-link" href="/today.html?tab=videos" title="查看今天生成的全部视频">
      <span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3.2"/><path d="M10.4 9.4l4.4 2.6-4.4 2.6z" fill="currentColor" stroke="none"/></svg></span>
      <div class="num" id="stat-today-videos">0</div><div class="label">今日新生成视频</div><div class="more">查看 ›</div>
    </a>
    <a class="stat-cell stat-link" href="/today.html?tab=tasks" title="查看正在进行的全部任务">
      <span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 1-8.5 8.5"/><path d="M12 7.5V12l3 1.8"/><path d="M3.5 7.5v4h4"/></svg></span>
      <div class="num" id="stat-tasks">0</div><div class="label">进行中任务</div><div class="more">查看 ›</div>
    </a>
  </div>

  <div class="card section-card">
    <div class="row wrap">
      <h2 class="page-title section-heading">最近项目</h2>
      <span class="chip" id="project-count-chip">0 个</span>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="location.href='/create.html'">＋ 新建项目</button>
    </div>
    <div id="scope-bar" class="scope-bar" style="display:none"></div>
    <div id="project-list" class="grid cols-3 mt"></div>
    <div id="empty-hint" class="empty" style="display:none">还没有项目，点击右上角「新建项目」开始。</div>
  </div>
</div>

<div class="toast"></div>
<script src="/js/common.js?v=20261028m"></script>
<script>
// 主账号查看某个运营时带 ?user=<uid>
const SCOPE_USER = new URLSearchParams(location.search).get('user') || '';
const QS = SCOPE_USER ? ('?user=' + encodeURIComponent(SCOPE_USER)) : '';

// 按时间与身份生成 Hero 问候
function greet() {
  if (SCOPE_USER) return;
  const h = new Date().getHours();
  const word = h < 6 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  const name = (window.ME && (ME.displayName || ME.username)) ? '，' + (ME.displayName || ME.username) : '';
  const t = document.getElementById('hero-title');
  if (t) t.textContent = `${word}${name}，今天想剪哪款产品？`;
}

async function load() {
  greet();
  // 子账号被授权「可看全部视频」时给出提示（首页统计仍只统计自己的数据）
  if (window.ME && ME.role !== 'owner' && ME.canViewAllVideos) {
    const tip = document.getElementById('perm-tip');
    if (tip) {
      tip.style.display = 'flex';
      tip.innerHTML = `<span>🔓 你已被主账号授权查看 <b>全部成员</b> 的今日视频（首页数字仍只统计你自己的）</span><div class="spacer"></div><a class="btn btn-sm" href="/today.html?tab=videos">去今日数据 ›</a>`;
    }
  }
  let projects = [];
  try { projects = await API.get('/api/projects' + QS); } catch(e){ toast(e.message); }
  const countChip = document.getElementById('project-count-chip');
  if (countChip) countChip.textContent = projects.length + ' 个';

  // 统计：优先使用后端 /api/stats（按服务器本地时区计算「今日」）
  let s = null;
  try { s = await API.get('/api/stats' + QS); } catch(e){ /* 后端不可用时回退前端计算 */ }
  if (!s) {
    const d = new Date();
    const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const sameDay = (iso) => {
      if (!iso) return false;
      const t = new Date(iso);
      if (isNaN(t.getTime())) return false;
      return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}` === today;
    };
    s = {
      projectCount: projects.length,
      todayProjects: projects.filter(p => sameDay(p.createdAt)).length,
      todayMaterials: projects.reduce((a,p)=> a + (p.todayMaterialCount||0), 0),
      todayVideos: projects.reduce((a,p)=> a + (p.todayVideoCount||0), 0),
      runningTasks: projects.filter(p => ['queued','planning','rendering'].includes(p.status)).length,
    };
  }
  document.getElementById('stat-projects').textContent = s.projectCount ?? 0;
  document.getElementById('stat-today-projects').textContent = s.todayProjects ?? 0;
  document.getElementById('stat-today-materials').textContent = s.todayMaterials ?? 0;
  document.getElementById('stat-today-videos').textContent = s.todayVideos ?? 0;
  document.getElementById('stat-tasks').textContent = s.runningTasks ?? 0;

  // 主账号：查看某个运营的数据时显示提示条
  if (SCOPE_USER) {
    let who = '该运营';
    try {
      const ov = await API.get('/api/team/overview');
      const row = (ov.rows || []).find(r => r.user.id === SCOPE_USER);
      if (row) who = row.user.displayName || row.user.username;
    } catch (_) {}
    const bar = document.getElementById('scope-bar');
    bar.style.display = 'flex';
    bar.innerHTML = `<span>正在查看运营 <b>${esc(who)}</b> 的项目与数据</span><div class="spacer"></div><a class="btn btn-sm" href="/index.html">返回我的全部项目</a>`;
    const title = document.getElementById('hero-title');
    if (title) title.textContent = '运营数据 · ' + who;
  }

  const list = document.getElementById('project-list');
  if (!projects.length) {
    list.innerHTML = '';
    document.getElementById('empty-hint').style.display = 'block';
    return;
  }
  list.innerHTML = projects.map(p => `
    <div class="card project-card" onclick="location.href='/project.html?id=${p.id}'">
      <button class="edit-btn" title="编辑项目参数" onclick="editProject(event,'${p.id}')">✏️ 编辑</button>
      <button class="del-btn" title="删除该项目（不可恢复）" onclick="delProject(event,'${p.id}')">删除</button>
      <div class="name">${esc(p.name)}</div>
      <div><span class="badge">${esc(p.category)}</span><span class="badge gray">${esc(p.ratio)}</span></div>
      <div class="meta-row">素材 ${p.materialCount} · 视频 ${p.videoCount} · ${fmtDate(p.updatedAt)}</div>
      ${(ME && ME.role === 'owner' && p.ownerName) ? `<div class="meta-row">归属：<span class="owner-tag">${esc(p.ownerName)}</span></div>` : ''}
      <div class="meta-row">状态：<span class="badge ${p.status==='error'?'warn':''}">${statusText(p.status)}</span></div>
    </div>`).join('');
}

// 编辑项目参数（跳到项目页并自动打开编辑弹窗）
function editProject(ev, id) {
  ev.preventDefault();
  ev.stopPropagation();
  location.href = '/project.html?id=' + id + '&edit=1';
}

// 删除项目（二次确认 + 阻止冒泡，避免误触进入项目页）
async function delProject(ev, id) {
  ev.preventDefault();
  ev.stopPropagation();
  const btn = ev.currentTarget;
  const card = btn.closest('.project-card');
  const name = card ? (card.querySelector('.name')?.textContent || '').trim() : '';
  const running = card && /渲染中|排队中|方案中/.test(card.textContent);
  const tip = running
    ? `该项目正在生成视频，删除后当前任务会被中断。\n\n确定删除「${name}」？素材、已生成视频和配置会一并删除，无法恢复。`
    : `确定删除「${name}」？\n\n该项目的素材、已生成视频和配置会一并删除，无法恢复。`;
  if (!confirm(tip)) return;

  btn.disabled = true;
  btn.textContent = '删除中';
  try {
    await API.del(`/api/projects/${id}`);
    toast('项目已删除');
    await load();
  } catch (e) {
    toast('删除失败：' + e.message);
    btn.disabled = false;
    btn.textContent = '删除';
  }
}
function statusText(s){ return {idle:'未开始',queued:'排队中',planning:'方案中',rendering:'渲染中',done:'已完成',error:'失败'}[s]||s; }
bootAuth().then(ok => { if (ok) load(); });
</script>
</body>
</html>
